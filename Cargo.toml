[package]
name = "mystampa"
version = "1.0.0"
edition = "2021"
description = "Automated thermal print service for the MySagra ecosystem"
license = "AGPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
chrono-tz = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rpassword = "7"
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[features]
default = ["gui"]
# Desktop window; the Docker image builds without it (--no-default-features).
gui = ["dep:eframe"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
